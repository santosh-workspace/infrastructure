# Terraform EC2 deployment.
#
# - Pull request → terraform plan only.
# - Push to main → terraform apply -auto-approve.
#
# Prerequisites (GitHub repo → Settings → Secrets and variables → Actions):
#   AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_REGION
# (AWS_REGION must match aws_region in environments/dev/global.tfvars.)

name: Terraform EC2 Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Avoid overlapping applies on main.
concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: false

env:
  TF_VERSION: ">= 1.10.0"
  AWS_REGION: ${{ secrets.AWS_REGION }}

jobs:
  ec2:
    name: "EC2 Stack"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: environments/dev/ec2
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Plan (PR)
        if: github.event_name == 'pull_request'
        run: terraform plan -var-file=../global.tfvars -input=false

      - name: Terraform Apply (push to main)
        if: github.event_name == 'push'
        run: terraform apply -var-file=../global.tfvars -auto-approve -input=false
