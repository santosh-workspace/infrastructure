# Manual EC2 teardown. NEVER runs on push/PR — only when you trigger it
# by hand, and only after production-environment approval.
#
# Run: GitHub repo → Actions → "Terraform EC2 Destroy" → Run workflow.

name: Terraform EC2 Destroy

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  TF_VERSION: ">= 1.10.0"
  AWS_REGION: ${{ secrets.AWS_REGION }}
  WORKING_DIR: environments/dev/ec2

jobs:
  destroy:
    name: "Terraform Destroy (needs approval)"
    runs-on: ubuntu-latest
    # ⏸ Same approval gate as apply: pauses until a "production"
    # environment reviewer approves.
    environment: production
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Destroy
        run: terraform destroy -var-file=../global.tfvars -auto-approve -input=false
